[project]
name = "gerrydb"
version = "0.2.0"
description = "Client library for GerryDB."
requires-python = ">=3.11"
authors = [{ name = "MGGG", email = "code@mggg.org" }]

dependencies = [
  "tomlkit>=0.13.3,<1.0.0",
  "msgpack>=1.1.1,<2.0.0",
  "httpx>=0.28.1,<1.0.0",
  "pydantic>=2.11.7,<3.0.0",
  "orjson>=3.10.0,<4.0.0",
  "shapely>=2.0.1,<3.0.0",
  "python-dateutil>=2.9.0,<3.0.0",
  "rapidfuzz>=3.9.0,<4.0.0",
  "geopandas>=1.1.1,<2.0.0",
  "networkx>=3.4.2,<4.0.0",
  "fastapi>=0.115.14,<1.0.0",
  "gerrychain>=0.3.2,<1.0.0",
  "colorlog>=6.9.0,<7.0.0",
  "GeoAlchemy2>=0.17.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1,<9.0.0",
  "ruff>=0.12.0,<1.0.0",
  "pytest-vcr>=1.0.2,<2.0.0",
  "pytest-cov>=6.2.1,<7.0.0",
  "pytest-asyncio>=1.0.0,<2.0.0",
  "pytest-httpx>=0.35.0,<1.0.0",
  "fiona>=1.10.1,<2.0.0",
  "pyarrow>=20.0.0,<30.0.0",
]

[tool.pytest.ini_options]
markers = [
  "vcr: mark a test as a vcr test",
  "slow: mark a test as slow",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
